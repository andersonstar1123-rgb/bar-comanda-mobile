workflows:
  ios-unsigned:
    name: iOS - IPA (sem assinatura)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: "16.4"
      cocoapods: default
      node: latest
      flutter: none
    scripts:
      - name: Instalar dependencias npm
        script: npm ci

      - name: Instalar pods (CocoaPods)
        script: cd ios && pod install

      - name: Compilar app para iPhone (sem assinatura)
        script: |
          set -e
          export PATH="$PATH:/usr/local/bin"
          cd ios
          xcodebuild \
            -workspace comanda.xcworkspace \
            -scheme comanda \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/DerivedData \
            -archivePath ../build/comanda.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          echo ">>> Empacotando IPA"
          mkdir -p ../build/ios/ipa/Payload
          cp -R ../build/comanda.xcarchive/Products/Applications/comanda.app ../build/ios/ipa/Payload/
          cd ../build/ios/ipa
          zip -r comanda-unsigned.ipa Payload
          echo ">>> IPA gerado:"
          ls -lh comanda-unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log